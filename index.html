<!DOCTYPE html>
<html lang="ka">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>ნეირონის სტრუქტურა — მინი თამაში</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


<header class="game-header">

    <div>

        <span class="eyebrow">
            BIOLOGY • MINI GAME
        </span>

        <h1>
            ნეირონის სტრუქტურა
        </h1>

        <p>
            გადაიტანე სწორი დასახელება შესაბამის უჯრაში
        </p>

    </div>


    <div class="progress-box">

        <span>
            პროგრესი
        </span>

        <strong id="progressText">
            0 / 5
        </strong>

    </div>

</header>



<main class="game-layout">


    <!-- =========================================
         ნეირონის პანელი
    ========================================== -->

    <section class="neuron-panel">


        <div class="panel-title">

            <span>
                01
            </span>

            <h2>
                იპოვე სტრუქტურები
            </h2>

        </div>



        <div
            class="neuron-board"
            id="neuronBoard"
        >


            <svg
                class="neuron-svg"
                viewBox="0 0 760 650"
                xmlns="http://www.w3.org/2000/svg"
            >


                <!-- =================================
                     ისრების მარკერი
                ================================== -->

                <defs>

                    <marker
                        id="arrowhead"
                        markerWidth="8"
                        markerHeight="8"
                        refX="7"
                        refY="3.5"
                        orient="auto"
                    >

                        <polygon
                            points="0 0, 8 3.5, 0 7"
                            fill="#8c9299"
                        />

                    </marker>

                </defs>



                <!-- =================================
                     დენდრიტები
                ================================== -->

                <g class="dendrites">


                    <path
                        d="M315 275
                           C270 245 225 215 175 175"
                    />


                    <path
                        d="M315 285
                           C260 275 205 265 145 240"
                    />


                    <path
                        d="M315 300
                           C255 305 205 315 150 335"
                    />


                    <path
                        d="M315 315
                           C265 335 220 365 175 410"
                    />


                    <path
                        d="M325 265
                           C300 215 280 175 265 125"
                    />


                    <path
                        d="M325 335
                           C300 380 280 420 270 470"
                    />

                </g>



                <!-- =================================
                     სომა
                ================================== -->

                <ellipse
                    class="soma"
                    cx="355"
                    cy="300"
                    rx="75"
                    ry="70"
                />



                <!-- =================================
                     ბირთვი
                ================================== -->

                <circle
                    class="nucleus"
                    cx="355"
                    cy="300"
                    r="27"
                />



                <!-- =================================
                     აქსონი
                     ერთი მთლიანი ნაცრისფერი ხაზი
                ================================== -->

                <path
                    class="axon"
                    d="M420 300
                       C470 305 515 320 555 345
                       C600 372 635 405 670 445"
                />



                <!-- =================================
                     მიელინის ქვეშ არსებული
                     ნაცრისფერი აქსონის ნაწილი
                ================================== -->

                <path
                    class="myelin-base"
                    d="M430 304
                       C475 312 515 328 555 352
                       C590 373 620 401 650 430"
                />



                <!-- =================================
                     მიელინის გარსები
                ================================== -->

                <g class="myelin">


                    <!-- I სეგმენტი -->

                    <rect
                        x="435"
                        y="288"
                        width="55"
                        height="48"
                        rx="24"
                        transform="rotate(12 462.5 312)"
                    />


                    <!-- II სეგმენტი -->

                    <rect
                        x="497"
                        y="309"
                        width="58"
                        height="48"
                        rx="24"
                        transform="rotate(23 526 333)"
                    />


                    <!-- III სეგმენტი -->

                    <rect
                        x="555"
                        y="344"
                        width="60"
                        height="48"
                        rx="24"
                        transform="rotate(32 585 368)"
                    />


                    <!-- IV სეგმენტი -->

                    <rect
                        x="612"
                        y="387"
                        width="58"
                        height="48"
                        rx="24"
                        transform="rotate(38 641 411)"
                    />

                </g>



                <!-- =================================
                     აქსონის დაბოლოებები
                ================================== -->

                <g class="axon-endings">


                    <path
                        d="M670 445
                           C695 455 715 450 735 435"
                    />


                    <path
                        d="M670 445
                           C695 475 715 485 740 480"
                    />


                    <path
                        d="M670 445
                           C695 430 715 415 735 400"
                    />

                </g>



                <!-- =================================
                     დენდრიტის ისარი
                ================================== -->

                <line
                    class="arrow-line"
                    x1="145"
                    y1="105"
                    x2="225"
                    y2="220"
                    marker-end="url(#arrowhead)"
                />



                <!-- =================================
                     სომის ისარი
                ================================== -->

                <line
                    class="arrow-line"
                    x1="125"
                    y1="520"
                    x2="310"
                    y2="345"
                    marker-end="url(#arrowhead)"
                />



                <!-- =================================
                     აქსონის ისარი
                     მიუთითებს ნაცრისფერ აქსონზე
                ================================== -->

                <line
                    class="arrow-line"
                    x1="640"
                    y1="135"
                    x2="430"
                    y2="302"
                    marker-end="url(#arrowhead)"
                />



                <!-- =================================
                     მიელინის გარსის ისარი
                ================================== -->

                <line
                    class="arrow-line"
                    x1="395"
                    y1="560"
                    x2="575"
                    y2="365"
                    marker-end="url(#arrowhead)"
                />



                <!-- =================================
                     აქსონის დაბოლოებების ისარი
                ================================== -->

                <line
                    class="arrow-line"
                    x1="650"
                    y1="510"
                    x2="682"
                    y2="448"
                    marker-end="url(#arrowhead)"
                />



                <!-- =================================
                     DROP ZONES
                ================================== -->


                <!-- დენდრიტი -->

                <rect
                    class="drop-zone"
                    data-target="dendrite"
                    x="55"
                    y="70"
                    width="175"
                    height="50"
                    rx="10"
                />



                <!-- სომა -->

                <rect
                    class="drop-zone"
                    data-target="soma"
                    x="55"
                    y="500"
                    width="205"
                    height="50"
                    rx="10"
                />



                <!-- აქსონი -->

                <rect
                    class="drop-zone"
                    data-target="axon"
                    x="575"
                    y="70"
                    width="150"
                    height="50"
                    rx="10"
                />



                <!-- მიელინის გარსი -->

                <rect
                    class="drop-zone"
                    data-target="myelin"
                    x="285"
                    y="550"
                    width="185"
                    height="50"
                    rx="10"
                />



                <!-- აქსონის დაბოლოებები -->

                <rect
                    class="drop-zone"
                    data-target="axon-endings"
                    x="555"
                    y="495"
                    width="175"
                    height="50"
                    rx="10"
                />


            </svg>

        </div>

    </section>



    <!-- =========================================
         ბარათების პანელი
    ========================================== -->

    <aside class="cards-panel">


        <div class="cards-header">

            <span
                class="phase-number"
                id="phaseNumber"
            >
                ეტაპი 1
            </span>


            <h2 id="cardsTitle">
                სტრუქტურები
            </h2>


            <p id="cardsDescription">
                გადაიტანე თითოეული დასახელება სწორ უჯრაში.
            </p>

        </div>



        <div
            class="cards-container"
            id="cardsContainer"
        ></div>



        <div
            class="finish-box"
            id="finishBox"
        >

            <div class="finish-icon">
                ✓
            </div>


            <h3>
                შესანიშნავია!
            </h3>


            <p>
                ნეირონის სტრუქტურა და ფუნქციები სწორად შეუსაბამე.
            </p>


            <button
                class="restart-button"
                id="restartButton"
            >
                ↻ თავიდან დაწყება
            </button>

        </div>

    </aside>

</main>



<div
    class="message"
    id="message"
>
    არასწორი შესაბამისობა
</div>



<script src="script.js"></script>

</body>

</html>
